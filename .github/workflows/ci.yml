name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by hand from the Actions tab or the API. The check runs except when
  # golden images are being made; the chosen task runs after it (D-049, D-056).
  # `check` runs the check alone; the agent workflow starts it on the pull
  # requests it opens, which start no pull_request run of their own.
  workflow_dispatch:
    inputs:
      task:
        description: What to do besides the checks
        type: choice
        options: [apk, goldens, check, spike-s1-text, spike-apk]
        default: apk
      scope:
        description: Milestone or requirement ID for the golden commit message, e.g. M0.2
        required: false
      # Spike tasks of M0.4 (D-068, D-072); removed with the spike code. The
      # D-079 URL (rub=false) serves the same file as part 1's rub=true URL;
      # both hashes pinned from run 38167073258 (docs/spikes/S1-surah-rendering.md).
      tanzil_url:
        description: Tanzil Uthmani XML download URL (spike tasks)
        required: false
        default: https://tanzil.net/pub/download/index.php?quranType=uthmani&outType=xml&marks=true&sajdah=true&rub=false&agree=true
      tanzil_sha256:
        description: Expected SHA-256 of that file; empty to only report it
        required: false
        default: 33f4113df84c1bab0ee2eb69616139fda619bdd56fc163a72532daaf0431bf57
      tanzil_pack_sha256:
        description: Expected SHA-256 of the spike pack's text.sqlite, checked on the device (spike-apk); empty to only report it
        required: false
        default: ff566f8fa2664b653fefd08c405f80f639c791845964042633a263ff4873e24a

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.task || 'check' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned by D-040; also in agent.yml and .claude/hooks/session-start.sh.
  FLUTTER_VERSION: 3.44.7

jobs:
  check:
    name: Format, analyze, test
    if: github.event_name != 'workflow_dispatch' || inputs.task != 'goldens'
    # The golden platform (docs/DESIGN_SYSTEM.md, "Type"): goldens are made and compared here.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install packages and regenerate localisations
        run: flutter pub get

      - name: Generated files are committed and up to date
        run: |
          git status --porcelain -- lib/l10n
          test -z "$(git status --porcelain -- lib/l10n)"

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test test tools/gen/test spike

      - name: Keep golden failure images
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Build Android (debug APK)
    # Started by hand only, when an APK is wanted for a device (D-049).
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'apk'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build
        run: flutter build apk --debug

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: holyquran-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  goldens:
    name: Update golden images
    # Creates or updates the golden images on the golden platform and commits
    # them to the branch it was started on (docs/DESIGN_SYSTEM.md, "Type").
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.task == 'goldens' &&
      github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # The token is not left in .git/config while branch code and packages
      # run; only the final push step receives it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Update golden images
        # Start from no images, so an image whose test was renamed or removed
        # is deleted instead of kept forever.
        run: |
          find test -path '*/goldens/*.png' -delete
          flutter test --tags golden --update-goldens

      - name: Commit changed images
        env:
          SCOPE: ${{ inputs.scope }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':(glob)test/**/goldens/*.png'
          if git diff --cached --quiet; then
            echo "No golden images changed."
            exit 0
          fi
          git commit -m "test(ds): update golden images (${SCOPE:-goldens})" -m "Generated on ubuntu-24.04 by $RUN_URL"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"

  # M0.4 spikes (D-068, D-072). The Quran text is fetched here only, never
  # committed, never printed: steps report hashes, counts and addresses.
  spike-s1-text:
    name: Spike S1 on the real text
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'spike-s1-text'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Fetch the Tanzil file
        env:
          TANZIL_URL: ${{ inputs.tanzil_url }}
          EXPECTED: ${{ inputs.tanzil_sha256 }}
        run: |
          mkdir -p data/raw/tanzil
          curl -fsSL --proto '=https' --max-filesize 33554432 --retry 3 -o data/raw/tanzil/quran-uthmani.xml "$TANZIL_URL"
          actual=$(sha256sum data/raw/tanzil/quran-uthmani.xml | cut -d' ' -f1)
          bytes=$(stat -c %s data/raw/tanzil/quran-uthmani.xml)
          {
            echo "### Tanzil file"
            echo "- URL: \`$TANZIL_URL\`"
            echo "- Fetched: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Bytes: $bytes"
            echo "- SHA-256: \`$actual\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$EXPECTED" ] && [ "$EXPECTED" != "$actual" ]; then
            echo "SHA-256 differs from the expected value." >&2
            exit 1
          fi

      - name: Build the spike pack
        env:
          TANZIL_URL: ${{ inputs.tanzil_url }}
        run: |
          set -o pipefail
          dart run spike/s1/tool/build_tanzil_pack.dart \
            --input data/raw/tanzil/quran-uthmani.xml --out data/build/spike \
            --source-url "$TANZIL_URL" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo "- text.sqlite SHA-256: \`$(sha256sum data/build/spike/spike-tanzil-uthmani/1/text.sqlite | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Integrity suite on the spike pack
        run: >-
          flutter test test/integrity
          "--dart-define=HOLYQURAN_PACK_DIR=$PWD/data/build/spike/spike-tanzil-uthmani/1"

      - name: S1 measurements on the real text
        if: hashFiles('spike/s1/real_text_measure_test.dart') != ''
        run: >-
          flutter test spike/s1/real_text_measure_test.dart
          "--dart-define=SPIKE_PACK_DIR=$PWD/data/build/spike/spike-tanzil-uthmani/1"

      - name: S7 geometry on the real text
        if: ${{ !cancelled() && hashFiles('spike/s7/real_text_s7_test.dart') != '' }}
        run: >-
          flutter test spike/s7/real_text_s7_test.dart
          "--dart-define=SPIKE_PACK_DIR=$PWD/data/build/spike/spike-tanzil-uthmani/1"

      - name: S4 fit on the real text
        if: ${{ !cancelled() && hashFiles('spike/s4/real_text_s4_test.dart') != '' }}
        run: >-
          flutter test spike/s4/real_text_s4_test.dart
          "--dart-define=SPIKE_PACK_DIR=$PWD/data/build/spike/spike-tanzil-uthmani/1"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: spike-results
          path: build/spike/*-results.json
          if-no-files-found: ignore
          retention-days: 90

  spike-apk:
    name: Build the spike APK (profile)
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'spike-apk'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build
        env:
          TANZIL_URL: ${{ inputs.tanzil_url }}
          TANZIL_SHA256: ${{ inputs.tanzil_sha256 }}
          TANZIL_PACK_SHA256: ${{ inputs.tanzil_pack_sha256 }}
        run: >-
          flutter build apk --profile -t spike/main.dart
          "--dart-define=SPIKE_TANZIL_URL=$TANZIL_URL"
          "--dart-define=SPIKE_TANZIL_SHA256=$TANZIL_SHA256"
          "--dart-define=SPIKE_TANZIL_PACK_SHA256=$TANZIL_PACK_SHA256"

      # Whether this APK installs over an earlier one depends on the signing
      # key, which may differ between runners.
      - name: Size and signer
        run: |
          apk=build/app/outputs/flutter-apk/app-profile.apk
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          {
            echo "### Spike APK"
            echo "- Size: $(stat -c %s "$apk") bytes"
            echo "- Signer certificate SHA-256: \`$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: holyquran-spike-apk
          path: build/app/outputs/flutter-apk/app-profile.apk
          retention-days: 90
