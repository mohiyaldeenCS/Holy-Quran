name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned by D-040; also in .claude/hooks/session-start.sh.
  FLUTTER_VERSION: 3.44.7

jobs:
  check:
    name: Format, analyze, test, build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install packages and regenerate localisations
        run: flutter pub get

      - name: Generated files are committed and up to date
        run: |
          git status --porcelain -- lib/l10n
          test -z "$(git status --porcelain -- lib/l10n)"

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android (debug)
        run: flutter build apk --debug
