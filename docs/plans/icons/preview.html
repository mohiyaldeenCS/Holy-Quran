  [data-theme="paper"] { --ground: #f8f2e4; --line: #ddd2b8; --ink: #1b2a28; --ink-muted: #51605d; --primary: #0e5a52; }
  [data-theme="night"] { --ground: #0a1413; --line: #25393a; --ink: #e8e2d0; --ink-muted: #a7b3af; --primary: #d9ae5a; }
  body { margin: 0; font-family: sans-serif; }
  section { background: var(--ground); color: var(--ink); padding: 16px 24px 24px; }
  h2, h3 { margin: 16px 0 8px; font-weight: 600; }
  h3 { color: var(--ink-muted); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
  figure { margin: 0; padding: 12px 8px 8px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; border: 1px solid var(--line); border-radius: 12px; }
  .proposals figure { border-color: var(--primary); }
  figcaption { flex-basis: 100%; text-align: center; font-size: 12px; color: var(--ink-muted); }
</style>
