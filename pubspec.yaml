name: holyquran
description: "القرآن الكريم: an Arabic app for reading, listening to, studying and memorising the Quran."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  crypto: ^3.0.7
  drift: ^2.35.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^18.0.2
  intl: any
  provider: ^6.1.5+1
  sqlite3: ^3.5.2

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.35.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  path_parsing: ^1.1.0

flutter:
  generate: true
  uses-material-design: true

  # Copied byte for byte from design/design-system/fonts/ttf/ (D-026); a test
  # compares their hashes with design/README.md.
  fonts:
    - family: Amiri Quran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: Reem Kufi
      fonts:
        - asset: assets/fonts/ReemKufi-Variable.ttf
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

  assets:
    - assets/licenses/
